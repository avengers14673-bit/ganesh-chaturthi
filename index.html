<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ganpati Bappa Morya 🙏❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff7e00, #ffb300, #ff5e00);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 25px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    img {
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      display: block;
      margin: 0 auto 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #ff6500;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    .heart {
      margin-top: 20px;
      font-size: 24px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Ganpati Image -->
    <img src="./ganpati.png" alt="Ganpati Bappa">

    <h1>Ganpati Bappa Morya 🙏</h1>

    <p>
      Mangal Murti Morya ❤️
    </p>

    <!-- Bappa Music -->
    <audio id="bappaMusic" loop>
      <source src="./bappa-music.mp3" type="audio/mpeg">
    </audio>

    <button onclick="playMusic()">
      🎵 Play Bappa Music
    </button>

    <div class="heart">
      🙏 ❤️ 🐘 ❤️ 🙏
    </div>

  </div>

  <script>
    function playMusic() {
      const music = document.getElementById("bappaMusic");

      music.play()
        .then(() => {
          console.log("Music started");
        })
        .catch((error) => {
          console.log("Music could not start:", error);
        });
    }
  </script>

</body>
</html>
