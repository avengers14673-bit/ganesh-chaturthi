<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ganpati Bappa Morya 🙏</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at center, #ffb300 0%, #d85b00 35%, #551600 75%, #180500 100%);
      color: #fff;
    }

    /* ---------- INTRO ---------- */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(circle at center, #ffca28 0%, #e66b00 35%, #5b1900 75%, #160400 100%);
      transition: opacity 1.5s ease, visibility 1.5s ease;
    }

    #intro.hide {
      opacity: 0;
      visibility: hidden;
    }

    .intro-content {
      animation: introGlow 2s ease-in-out infinite alternate;
      padding: 25px;
    }

    .om {
      font-size: 85px;
      color: #fff3b0;
      text-shadow:
        0 0 10px #fff,
        0 0 25px #ffd54f,
        0 0 45px #ff9800;
      margin-bottom: 25px;
    }

    .mantra {
      font-size: clamp(28px, 7vw, 50px);
      font-weight: bold;
      color: #fff8dc;
      text-shadow:
        0 0 10px #fff,
        0 0 25px #ffca28,
        0 0 45px #ff6f00;
      letter-spacing: 1px;
    }

    .small-text {
      margin-top: 18px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 4px;
      color: #ffe9a3;
    }

    @keyframes introGlow {
      from {
        transform: scale(1);
        filter: brightness(1);
      }

      to {
        transform: scale(1.04);
        filter: brightness(1.15);
      }
    }

    /* ---------- MAIN WEBSITE ---------- */

    #main {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }

    #main.show {
      opacity: 1;
      transform: scale(1);
    }

    .card {
      width: min(92vw, 480px);
      max-height: 92vh;
      overflow-y: auto;
      padding: 25px 20px 30px;
      text-align: center;

      background: rgba(35, 8, 0, 0.48);
      border: 2px solid rgba(255, 213, 79, 0.8);
      border-radius: 30px;

      box-shadow:
        0 0 20px rgba(255, 193, 7, 0.45),
        0 0 60px rgba(255, 111, 0, 0.3),
        inset 0 0 30px rgba(255, 183, 0, 0.12);

      backdrop-filter: blur(8px);
    }

    .top-om {
      font-size: 38px;
      color: #ffd54f;
      text-shadow: 0 0 15px #ff9800;
    }

    .title {
      margin-top: 5px;
      font-size: clamp(30px, 8vw, 45px);
      color: #ffe082;
      text-shadow:
        0 0 8px #fff,
        0 0 20px #ff9800;
    }

    .subtitle {
      margin-top: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      color: #ffe9a3;
    }

    .divider {
      width: 80%;
      height: 1px;
      margin: 18px auto;
      background: linear-gradient(
        to right,
        transparent,
        #ffd54f,
        transparent
      );
    }

    /* ---------- GANPATI IMAGE ---------- */

    .ganpati-box {
      position: relative;
      width: 100%;
      margin: 10px auto 20px;
    }

    .ganpati-box::before {
      content: "";
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      background: rgba(255, 193, 7, 0.25);
      filter: blur(30px);
      z-index: 0;
    }

    .ganpati {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      max-height: 430px;
      object-fit: contain;
      border-radius: 22px;
      box-shadow:
        0 0 20px rgba(255, 215, 100, 0.45),
        0 0 45px rgba(255, 152, 0, 0.25);
    }

    /* ---------- BLESSING ---------- */

    .blessing {
      padding: 20px 15px;
      border-radius: 20px;
      background: rgba(255, 193, 7, 0.08);
      border: 1px solid rgba(255, 213, 79, 0.4);
    }

    .blessing h2 {
      font-size: 25px;
      color: #ffd54f;
      margin-bottom: 12px;
      text-shadow: 0 0 12px #ff9800;
    }

    .blessing p {
      font-size: 17px;
      line-height: 1.7;
      color: #fff4cf;
    }

    .morya {
      margin-top: 18px;
      font-size: 25px;
      color: #ffe082;
      text-shadow: 0 0 15px #ff9800;
    }

    /* ---------- MUSIC ---------- */

    .music-btn {
      margin-top: 20px;
      padding: 12px 22px;
      border: 1px solid #ffd54f;
      border-radius: 30px;
      background: rgba(255, 193, 7, 0.15);
      color: #fff3c4;
      font-size: 15px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    .music-btn:active {
      transform: scale(0.96);
    }

    /* ---------- FLOATING PARTICLES ---------- */

    .particle {
      position: fixed;
      bottom: -20px;
      color: #ffd54f;
      font-size: 18px;
      pointer-events: none;
      animation: floatUp linear forwards;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 0;
      }

      20% {
        opacity: 0.9;
      }

      to {
        transform: translateY(-110vh) scale(0.5);
        opacity: 0;
      }
    }

    /* ---------- SCROLLBAR ---------- */

    .card::-webkit-scrollbar {
      width: 5px;
    }

    .card::-webkit-scrollbar-thumb {
      background: #ffca28;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- INTRO SCREEN -->
  <div id="intro">
    <div class="intro-content">

      <div class="om">ॐ</div>

      <div class="mantra">
        ॐ श्री गणेशाय नमः
      </div>

      <div class="small-text">
        शुभारंभ • मंगलमय
      </div>

    </div>
  </div>


  <!-- MAIN WEBSITE -->
  <main id="main">

    <div class="card">

      <div class="top-om">ॐ</div>

      <h1 class="title">
        गणपति बप्पा मोरया
      </h1>

      <div class="subtitle">
        MANGAL MURTI MORAYA
      </div>

      <div class="divider"></div>


      <!-- GANPATI IMAGE -->
      <div class="ganpati-box">

        <img
          class="ganpati"
          src="./ganpati.png"
          alt="Lord Ganesha">

      </div>


      <!-- BLESSING -->
      <section class="blessing">

        <h2>🙏 Bappa's Blessings 🙏</h2>

        <p>
          May Lord Ganesha remove every obstacle
          from your path and fill your life with
          happiness, peace, prosperity and success.
        </p>

        <div class="morya">
          ❤️ गणपति बप्पा मोरया ❤️
        </div>

      </section>


      <!-- MUSIC -->
      <audio id="bappaMusic" loop>
        <source src="./bappa-music.mp3" type="audio/mpeg">
      </audio>

      <button class="music-btn" onclick="toggleMusic()">
        🎵 Play Bappa Music
      </button>

    </div>

  </main>


  <script>

    /* INTRO DISAPPEARS AFTER A FEW SECONDS */

    setTimeout(function () {

      document.getElementById("intro").classList.add("hide");

      setTimeout(function () {
        document.getElementById("main").classList.add("show");
      }, 500);

    }, 3500);


    /* MUSIC BUTTON */

    function toggleMusic() {

      const music = document.getElementById("bappaMusic");
      const button = document.querySelector(".music-btn");

      if (music.paused) {

        music.play()
          .then(function () {
            button.innerHTML = "⏸️ Pause Bappa Music";
          })
          .catch(function () {
            button.innerHTML = "🎵 Tap Again to Play";
          });

      } else {

        music.pause();
        button.innerHTML = "🎵 Play Bappa Music";

      }

    }


    /* GOLDEN FLOATING PARTICLES */

    function createParticle() {

      const particle = document.createElement("div");

      particle.className = "particle";

      const symbols = ["✨", "🪔", "🌼", "✦", "•"];

      particle.innerHTML =
        symbols[Math.floor(Math.random() * symbols.length)];

      particle.style.left =
        Math.random() * 100 + "vw";

      particle.style.fontSize =
        (12 + Math.random() * 14) + "px";

      particle.style.animationDuration =
        (5 + Math.random() * 6) + "s";

      document.body.appendChild(particle);

      setTimeout(function () {
        particle.remove();
      }, 12000);
    }

    setInterval(createParticle, 500);

  </script>

</body>
</html>
